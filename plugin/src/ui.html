<!doctype html>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; font: 12px/1.5 Inter, system-ui, sans-serif; }
  body { margin: 16px; }
  strong { display: block; margin-bottom: 6px; }
  #status { opacity: .72; }
</style>
<strong>Figma Gateway</strong>
<div id="status">Connecting…</div>
<script>
  const PORT = __GATEWAY_PORT__;
  let identity = null;
  let socket = null;
  let retry = 250;

  function connect() {
    if (!identity || (socket && socket.readyState < 2)) return;
    socket = new WebSocket(`ws://localhost:${PORT}/plugin`);
    socket.onopen = () => {
      retry = 250;
      document.getElementById("status").textContent = "Checking connection…";
      socket.send(JSON.stringify({ type: "hello", secret: identity.secret, file: identity.file }));
    };
    socket.onmessage = (event) => {
      try {
        const message = JSON.parse(event.data);
        if (message.type === "connected") {
          document.getElementById("status").textContent = "Connected";
          return;
        }
        parent.postMessage({ pluginMessage: message }, "*");
      } catch (error) {
        socket.send(JSON.stringify({ type: "protocol-error", error: String(error) }));
      }
    };
    socket.onclose = () => {
      document.getElementById("status").textContent = "Reconnecting…";
      socket = null;
      setTimeout(connect, retry);
      retry = Math.min(retry * 2, 5000);
    };
  }

  onmessage = (event) => {
    const message = event.data.pluginMessage;
    if (!message) return;
    if (message.type === "initialize") {
      identity = message;
      connect();
      return;
    }
    if (message.type === "file-updated") {
      if (identity) identity.file = message.file;
      if (socket && socket.readyState === WebSocket.OPEN) {
        socket.send(JSON.stringify({ type: "file-updated", file: message.file }));
      }
      return;
    }
    if (socket && socket.readyState === WebSocket.OPEN) socket.send(JSON.stringify(message));
  };
</script>
