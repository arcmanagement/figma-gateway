name: Publish Homebrew Metadata

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out public main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Download verified Homebrew metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p artifacts
          gh release download "$RELEASE_TAG" \
            --pattern FigmaGateway.rb \
            --pattern FigmaGatewayCask.rb \
            --dir artifacts

      - name: Publish Formula and Cask in this repository
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p Casks
          cp artifacts/FigmaGateway.rb Formula/figma-gateway.rb
          cp artifacts/FigmaGatewayCask.rb Casks/figma-gateway.rb
          if git diff --quiet -- Formula/figma-gateway.rb Casks/figma-gateway.rb; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Formula/figma-gateway.rb Casks/figma-gateway.rb
          git diff --cached --check
          git commit -m "Update Homebrew metadata for $RELEASE_TAG"
          git push origin HEAD:main
