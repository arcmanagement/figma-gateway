name: Publish verified release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Draft release tag to verify and publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-release-${{ inputs.tag }}

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Verify complete draft and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          version="${tag#v}"
          test "$tag" = "v$version"
          test "$(gh release view "$tag" --repo "$REPOSITORY" --json isDraft --jq .isDraft)" = true

          required=(
            "figma-gateway-$version.tgz"
            "figma-gateway-$version-windows-x64.exe"
            "figma-gateway-$version-windows-arm64.exe"
            "figma-gateway-$version-macos-arm64.zip"
            "figma-gateway-$version-macos-arm64.zip.sha256.txt"
            "figma-gateway-$version-macos-x64.zip"
            "figma-gateway-$version-macos-x64.zip.sha256.txt"
            "FigmaGateway.rb"
            "FigmaGatewayCask.rb"
          )
          assets="$(gh release view "$tag" --repo "$REPOSITORY" --json assets --jq '.assets[].name')"
          for asset in "${required[@]}"; do
            grep -Fxq "$asset" <<<"$assets" || { echo "Missing release asset: $asset" >&2; exit 1; }
          done

          mkdir -p artifacts
          for asset in "${required[@]}"; do
            gh release download "$tag" --repo "$REPOSITORY" --pattern "$asset" --dir artifacts
          done
          (
            cd artifacts
            sha256sum --check "figma-gateway-$version-macos-arm64.zip.sha256.txt"
            sha256sum --check "figma-gateway-$version-macos-x64.zip.sha256.txt"
          )
          for archive in artifacts/figma-gateway-*-macos-*.zip; do
            if unzip -Z1 "$archive" | grep -Eq '(^|/)\._|^__MACOSX/'; then
              echo "AppleDouble metadata found in $archive" >&2
              exit 1
            fi
          done

          arm_sha="$(sha256sum "artifacts/figma-gateway-$version-macos-arm64.zip" | cut -d' ' -f1)"
          x64_sha="$(sha256sum "artifacts/figma-gateway-$version-macos-x64.zip" | cut -d' ' -f1)"
          grep -Fq "$arm_sha" artifacts/FigmaGatewayCask.rb
          grep -Fq "$x64_sha" artifacts/FigmaGatewayCask.rb
          gh release edit "$tag" --repo "$REPOSITORY" --draft=false
